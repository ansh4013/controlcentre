<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Live ranking, workspace, chatbot analytics and status for Nexora AI, Discipline and the Dashboard.">

<meta property="og:description" content="Live ranking, workspace, chatbot analytics and status for Nexora AI, Discipline and the Dashboard.">

<title>Analysis Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  @property --p{syntax:'<number>';inherits:false;initial-value:0}
  :root{--bg:#06070f;--card:rgba(20,24,48,.62);--card-solid:#10142a;--line:rgba(160,170,255,.14);--line2:rgba(160,170,255,.28);
    --tx:#f3f5ff;--tx2:#a1a9d0;--tx3:#6b7399;--track:rgba(160,170,255,.14);--c1:#4f8cff;--c2:#8b5cf6;--c3:#22d3ee;
    --gold:#fbbf24;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--shadow:0 10px 40px rgba(0,0,0,.35);--r:20px;
    --glow:radial-gradient(600px 300px at 20% -10%,rgba(79,140,255,.22),transparent 60%),radial-gradient(520px 320px at 100% 0%,rgba(139,92,246,.2),transparent 55%)}
  [data-theme=light]{--bg:#f4f6fc;--card:rgba(255,255,255,.85);--card-solid:#fff;--line:rgba(30,40,90,.10);--line2:rgba(30,40,90,.22);
    --tx:#10152b;--tx2:#51597d;--tx3:#8a91b0;--track:rgba(30,40,90,.08);--shadow:0 10px 34px rgba(40,60,140,.10);
    --glow:radial-gradient(600px 300px at 20% -10%,rgba(79,140,255,.2),transparent 60%),radial-gradient(520px 320px at 100% 0%,rgba(139,92,246,.14),transparent 55%)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--glow),var(--bg);background-attachment:fixed;color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:inherit}
  .num,.display{font-family:'Space Grotesk',Inter,sans-serif;font-variant-numeric:tabular-nums}
  .grow{flex:1}

  /* top bar + tabs */
  .bar{position:sticky;top:0;z-index:30;backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:1px solid var(--line)}
  .bar-in{max-width:1180px;margin:0 auto;padding:.65rem 1rem;display:flex;align-items:center;gap:.7rem}
  .logo{width:34px;height:34px;border-radius:10px;background:conic-gradient(from 210deg,var(--c1),var(--c2),var(--c3),var(--c1));display:grid;place-items:center;box-shadow:0 4px 18px rgba(79,140,255,.45)}
  .brand{font-weight:700;letter-spacing:-.01em}.brand small{display:block;font-weight:500;font-size:.68rem;color:var(--tx3);margin-top:-1px}
  .chip-s{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;font-weight:600;padding:.32rem .7rem;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);background:var(--card)}
  .chip-s i{width:7px;height:7px;border-radius:50%;background:var(--tx3)}
  .chip-s.live{color:var(--ok)}.chip-s.live i{background:var(--ok)}.chip-s.partial i,.chip-s.cached i{background:var(--warn)}.chip-s.offline i{background:var(--bad)}
  .ibtn{height:36px;min-width:36px;padding:0 .75rem;border-radius:11px;border:1px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:.4rem;font-size:.8rem;font-weight:600;text-decoration:none;transition:.2s}
  .ibtn:hover{border-color:var(--c1);transform:translateY(-1px)}
  .kbd{font-size:.68rem;color:var(--tx3);border:1px solid var(--line2);border-radius:6px;padding:.05rem .35rem}
  .tabs{max-width:1180px;margin:0 auto;padding:0 1rem;display:flex;gap:.2rem;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;border:0;background:none;padding:.65rem .85rem;font-size:.84rem;font-weight:600;color:var(--tx3);border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
  .tab:hover{color:var(--tx)}.tab.on{color:var(--tx);border-color:var(--c1)}

  main{max-width:1180px;margin:0 auto;padding:1.3rem 1rem 3.5rem}
  .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
  .ph{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:.6rem;margin-bottom:1rem}
  .ph h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(1.5rem,3.6vw,2.1rem);letter-spacing:-.03em;margin:.15rem 0 0}
  .ph p{margin:.3rem 0 0;color:var(--tx2);font-size:.86rem;max-width:62ch}
  .grad{background:linear-gradient(95deg,var(--c1),var(--c2) 55%,var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:1.1rem 1.2rem;min-width:0}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.85rem;flex-wrap:wrap}
  .card-h h2,.card-h h3{margin:0;font-size:.95rem;font-weight:700;letter-spacing:-.01em}
  .card-h p{margin:.15rem 0 0;font-size:.74rem;color:var(--tx3)}
  .grid{display:grid;gap:1rem}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .mt{margin-top:1rem}
  .btn{border:1px solid var(--line2);background:transparent;border-radius:10px;padding:.42rem .85rem;font-size:.78rem;font-weight:600;transition:.2s}
  .btn:hover{border-color:var(--c1)}
  .btn.pri{background:linear-gradient(135deg,var(--c1),var(--c2));border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(79,140,255,.32)}
  .btn.sm{padding:.25rem .55rem;font-size:.72rem;border-radius:8px}.btn.dng:hover{border-color:var(--bad);color:var(--bad)}
  .tag{display:inline-block;font-size:.68rem;font-weight:650;padding:.2rem .55rem;border-radius:999px;background:var(--track);color:var(--tx2);white-space:nowrap}
  .tag.g{background:rgba(52,211,153,.15);color:var(--ok)}.tag.a{background:rgba(251,191,36,.16);color:var(--warn)}.tag.r{background:rgba(251,113,133,.16);color:var(--bad)}.tag.b{background:rgba(79,140,255,.16);color:var(--c1)}
  .muted{color:var(--tx3);font-size:.76rem}
  .empty{padding:1.4rem;text-align:center;color:var(--tx3);font-size:.85rem;border:1px dashed var(--line2);border-radius:14px}

  /* KPI + rag */
  .kpi{padding:1rem 1.1rem}.kpi .l{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
  .kpi .v{font-family:'Space Grotesk',sans-serif;font-size:1.8rem;font-weight:700;letter-spacing:-.03em;margin:.2rem 0}
  .kpi .d{font-size:.76rem;font-weight:600}.up{color:var(--ok)}.dn{color:var(--bad)}.fl{color:var(--tx3)}
  .rag{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:.45rem}
  .rag.green{background:var(--ok);box-shadow:0 0 10px var(--ok)}.rag.amber{background:var(--warn);box-shadow:0 0 10px var(--warn)}.rag.red{background:var(--bad);box-shadow:0 0 10px var(--bad)}
  .prod{display:flex;gap:.9rem;align-items:flex-start;padding:.9rem 0;border-top:1px solid var(--line)}.prod:first-child{border-top:0}
  .prod b{font-size:.95rem}.prod ul{margin:.3rem 0 0;padding-left:1.1rem;color:var(--tx2);font-size:.8rem;line-height:1.55}
  .bar-p{height:8px;border-radius:99px;background:var(--track);overflow:hidden}.bar-p i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .fun{display:grid;gap:.5rem}.fun .row{display:grid;grid-template-columns:92px 1fr 64px;align-items:center;gap:.7rem;font-size:.8rem}
  .fun .b{height:26px;border-radius:8px;background:linear-gradient(90deg,var(--c1),var(--c2));min-width:4px;transition:width .7s}

  /* ring */
  .ring{--p:0;--s:64px;--t:7px;width:var(--s);height:var(--s);border-radius:50%;position:relative;display:grid;place-items:center;flex:none;background:conic-gradient(from -90deg,var(--k,var(--c1)) calc(var(--p)*1%),var(--track) 0);transition:--p .9s cubic-bezier(.2,.8,.2,1)}
  .ring::after{content:'';position:absolute;inset:var(--t);border-radius:50%;background:var(--card-solid)}
  .ring b{position:relative;z-index:1;font-family:'Space Grotesk',sans-serif;font-size:calc(var(--s)*.27)}

  /* OKR */
  .kr{padding:.8rem 0;border-top:1px solid var(--line)}.kr:first-of-type{border-top:0}
  .kr-h{display:flex;justify-content:space-between;gap:.6rem;align-items:flex-start;flex-wrap:wrap;margin-bottom:.45rem;font-size:.85rem;font-weight:600}
  .kr-m{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;margin-top:.5rem;font-size:.74rem;color:var(--tx3)}
  input[type=range]{-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;outline:none;background:linear-gradient(90deg,var(--c1) var(--v,0%),var(--track) var(--v,0%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--c1);cursor:grab}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--c1)}
  .inp,.sel,.txa{width:100%;background:var(--track);border:1px solid transparent;border-radius:10px;padding:.5rem .65rem;font-size:.84rem;outline:none}
  .inp:focus,.sel:focus,.txa:focus{border-color:var(--c1)}
  .inp.s{width:80px;padding:.25rem .45rem;font-size:.76rem;border-radius:8px}
  .txa{min-height:70px;resize:vertical}

  /* kanban */
  .board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem;align-items:start}
  .lane{background:color-mix(in srgb,var(--card-solid) 45%,transparent);border:1px solid var(--line);border-radius:16px;padding:.7rem;min-height:140px}
  .lane.over{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 8%,transparent)}
  .lane-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx2)}
  .item{background:var(--card-solid);border:1px solid var(--line);border-radius:13px;padding:.7rem .75rem;margin-bottom:.55rem;cursor:grab;transition:transform .2s,border-color .2s}
  .item:hover{border-color:var(--line2);transform:translateY(-1px)}.item.drag{opacity:.4}
  .item b{font-size:.84rem;display:block;margin-bottom:.35rem;letter-spacing:-.01em}
  .item .meta{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
  .item .acts{display:flex;gap:.25rem;margin-top:.5rem}
  .pr{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--gold);font-size:.78rem}

  table.t{width:100%;border-collapse:collapse;font-size:.82rem}
  table.t th{text-align:left;font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);padding:.4rem .5rem;font-weight:700}
  table.t td{padding:.6rem .5rem;border-top:1px solid var(--line);vertical-align:middle}
  .tw{overflow-x:auto}

  /* switch */
  .sw{position:relative;width:42px;height:24px;flex:none}
  .sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
  .sw span{position:absolute;inset:0;background:var(--track);border-radius:99px;transition:.25s}
  .sw span::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .sw input:checked+span{background:linear-gradient(135deg,var(--c1),var(--c2))}.sw input:checked+span::after{transform:translateX(18px)}
  .flag{display:grid;grid-template-columns:auto 1fr 190px auto;gap:.9rem;align-items:center;padding:.85rem 0;border-top:1px solid var(--line)}.flag:first-child{border-top:0}
  code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  pre{background:var(--track);border-radius:12px;padding:.85rem;font-size:.74rem;overflow:auto;margin:0;line-height:1.55;color:var(--tx2)}
  code.k{background:var(--track);border-radius:6px;padding:.1rem .4rem;font-size:.76rem}

  /* dialog + palette + toast */
  dialog{border:1px solid var(--line2);border-radius:20px;background:var(--card-solid);color:var(--tx);padding:0;width:min(520px,94vw);box-shadow:0 30px 80px rgba(0,0,0,.5)}
  dialog::backdrop{background:rgba(4,6,16,.6);backdrop-filter:blur(4px)}
  .mf{padding:1.2rem 1.3rem;display:grid;gap:.8rem}.mf h3{margin:0;font-size:1.05rem}.mf label{display:grid;gap:.3rem;font-size:.74rem;font-weight:650;color:var(--tx2)}
  .mf .row2{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}.mf .acts{display:flex;justify-content:flex-end;gap:.5rem;margin-top:.3rem}
  .pal{padding:0}.pal input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:1rem 1.2rem;font-size:1rem;outline:none}
  .pal ul{list-style:none;margin:0;padding:.4rem;max-height:320px;overflow:auto}
  .pal li{padding:.6rem .8rem;border-radius:10px;font-size:.88rem;cursor:pointer;display:flex;justify-content:space-between}
  .pal li.on{background:linear-gradient(135deg,rgba(79,140,255,.25),rgba(139,92,246,.25))}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--card-solid);border:1px solid var(--line2);padding:.6rem 1rem;border-radius:12px;font-size:.82rem;opacity:0;transition:.3s;z-index:60;box-shadow:var(--shadow)}
  #toast.on{transform:translate(-50%,0);opacity:1}

  @media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.board{grid-template-columns:repeat(2,minmax(0,1fr))}.flag{grid-template-columns:auto 1fr}.flag .ro{grid-column:1/-1}}
  @media(max-width:600px){.g2,.g3,.g4,.board{grid-template-columns:1fr}.brand small,.hide-xs{display:none}.fun .row{grid-template-columns:70px 1fr 56px}}
  :focus-visible{outline:2px solid var(--c1);outline-offset:2px}
  .skip{position:absolute;left:-999px;top:.5rem;z-index:100;background:var(--card-solid);color:var(--tx);padding:.5rem .9rem;border-radius:10px;border:1px solid var(--line2)}.skip:focus{left:.8rem}
  .btn[disabled]{opacity:.45;cursor:not-allowed}.seg2{display:inline-flex;gap:.3rem;flex-wrap:wrap}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <button class="ibtn" id="themeBtn" title="Toggle theme" aria-label="Toggle light or dark theme" aria-label="Toggle light or dark theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>

<script>
window.addEventListener('error',function(e){var v=document.getElementById('view')||document.body;
  if(v&&!v.children.length){v.innerHTML='<div style="padding:2rem;font:14px system-ui;color:#fb7185">Something went wrong loading this page: '+String(e.message).replace(/</g,'&lt;')+'</div>';}});
</script>
<script>
/* ---- inlined from analysis-config.js (page works as a single file) ---- */
/**
 * analysis-config.js
 * -----------------
 * Single place to configure the Analysis Ranking System.
 * Works in the browser (window.NEXORA_RANKING_CONFIG) and in Node (require).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.NEXORA_RANKING_CONFIG = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  return {
    // Public counter API used by tracker.js
    api: 'https://countapi.mileshilliard.com/api/v1',
    timeoutMs: 8000,
    concurrency: 6,

    refreshMs: 30000,      // auto-refresh interval on analysis.html
    historyDays: 14,       // days of daily history used for trend scoring (min 14)
    engagedSeconds: 30,    // a visit counts as "engaged" after this many seconds
    confidenceK: 30,       // views needed for ~50% confidence in a site's score
    emaAlpha: 0.35,        // smoothing factor for recent-traffic average
    closeRaceGap: 2,       // score gap (points) below which a race is "close"

    sites: [
      { id: 'nexora',     name: 'Nexora AI',      key: 'ansh4013_nexora_views',     url: 'https://ansh4013.github.io/aichatbot-/' },
      { id: 'discipline', name: 'Discipline',     key: 'ansh4013_discipline_views', url: 'https://ansh4013.github.io/dashboard/discipline.html' },
      { id: 'dashboard',  name: 'Main Dashboard', key: 'ansh4013_dashboard_views',  url: 'https://ansh4013.github.io/dashboard/' }
    ],

    // ---- Chatbot analytics (Nexora AI) ----
    chat: {
      siteId: 'nexora',
      topics: [['coding', 'Coding'], ['writing', 'Writing'], ['study', 'Study & learning'], ['business', 'Business & career'], ['general', 'General']],
      latencyBuckets: [['lat_1', '< 1 s', 1000], ['lat_2', '1 – 2 s', 2000], ['lat_4', '2 – 4 s', 4000], ['lat_8', '4 – 8 s', 8000], ['lat_9', '8 s +', 16000]],
      depthBuckets: [['mpc_1', '1 message'], ['mpc_2', '2 messages'], ['mpc_3_5', '3 – 5 messages'], ['mpc_6p', '6+ messages']],
      thresholds: { errorRate: 0.10, csat: 0.60, p95Ms: 8000, minReplies: 20, minVotes: 10 }
    },
    sources: [['direct', 'Direct'], ['search', 'Search'], ['social', 'Social'], ['github', 'GitHub'], ['email', 'Email'], ['other', 'Other']],
    devices: [['desktop', 'Desktop'], ['mobile', 'Mobile']],
    vitals: [['lcp', 'Loading (LCP)', '≤ 2.5 s'], ['cls', 'Layout shift (CLS)', '≤ 0.1'], ['inp', 'Responsiveness (INP)', '≤ 200 ms']],

    // How sites link to each other (feeds PageRank "authority"). from/to are site ids.
    links: [
      { from: 'dashboard', to: 'nexora' },
      { from: 'dashboard', to: 'discipline' }
    ],

    // 'weighted' = weighted sum of metric scores
    // 'fusion'   = weighted Reciprocal Rank Fusion (merge each metric's ranking, like search engines)
    method: 'weighted',
    bayesM: 20,            // IMDb-style prior strength (sessions) for engagement quality
    hotGravity: 1.8,       // Hacker-News-style freshness decay

    // Relative importance of each metric (any scale — normalised automatically)
    weights: { reach: 15, traction: 15, momentum: 10, consistency: 10, engagement: 10, authority: 10, freshness: 15, elo: 15 },

    presets: {
      Balanced:   { reach: 15, traction: 15, momentum: 10, consistency: 10, engagement: 10, authority: 10, freshness: 15, elo: 15 },
      Popularity: { reach: 40, traction: 25, momentum: 0,  consistency: 5,  engagement: 0,  authority: 15, freshness: 5,  elo: 10 },
      Trending:   { reach: 5,  traction: 15, momentum: 30, consistency: 0,  engagement: 0,  authority: 0,  freshness: 35, elo: 15 },
      Quality:    { reach: 5,  traction: 10, momentum: 5,  consistency: 20, engagement: 40, authority: 10, freshness: 0,  elo: 10 },
      Competitive:{ reach: 5,  traction: 15, momentum: 10, consistency: 5,  engagement: 5,  authority: 5,  freshness: 15, elo: 40 }
    }
  };
});

      S.sprint = { name: next, start: isoDay(Date.now()), days: S.sprint.days, committed: Math.round(S.sprints.slice(-3).reduce(function (t, x) { return t + x.velocity; }, 0) / Math.min(3, S.sprints.length)) || S.sprint.committed, done: Array(S.sprint.days).fill(null) };
      logAct('Closed ' + S.sprints[S.sprints.length - 1].name + ' with velocity ' + st.cum, 'sprint'); save(); render(); toast('Sprint closed — committed ' + S.sprint.committed + ' pts based on velocity');
    },
    'export-all': function () { download('analysis-workspace-backup.json', JSON.stringify(S, null, 2), 'application/json'); },
    'import-all': function () { $('importFile').click(); },
    reset: function () { if (!confirm('Replace ALL workspace data with the sample data?')) return; S = norm(seed()); logAct('Restored sample data', 'info'); save(); render(); toast('Sample data restored'); }
  };
  ACT['refresh-data'] = function () { loadData(); toast('Refreshing…'); };
  ACT['toggle-notify'] = function () {
    if (!('Notification' in window)) { toast('Notifications are not supported here'); return; }
    if (S.notify && Notification.permission === 'granted') { S.notify = false; save(); render(); toast('Notifications off'); return; }
    Notification.requestPermission().then(function (p) { S.notify = p === 'granted'; save(); render(); toast(p === 'granted' ? 'Notifications on' : 'Permission not granted'); });
  };
  ACT['toggle-demo'] = function () { S.demo = !S.demo; EXT.chat = null; EXT.aud = {}; EXT.vit = null; save(); render(); loadChat().then(function () { evaluateAlerts(); render(); ensure(cur, true); }); toast(S.demo ? 'Demo data on' : 'Demo data off'); };
  ACT['aud-site'] = function (el) { S.audSite = el.dataset.v; save(); render(); ensure('audience'); };
  ACT['edit-funnel'] = function () {
    var sid = S.audSite || 'nexora';
    modal('Edit funnel steps', [{ name: 'steps', label: 'One step per line:  Label | metric   (metrics: views, sessions, engaged, returning, new, chat_convos, chat_msgs, ev:your_event)', type: 'textarea', value: funnelFor(sid).map(function (x) { return x[0] + ' | ' + x[1]; }).join('\n') }], function (v) {
      var steps = v.steps.split('\n').map(function (l) { var p = l.split('|'); return [(p[0] || '').trim(), (p[1] || '').trim().toLowerCase().replace(/[^a-z0-9:_]/g, '')]; }).filter(function (x) { return x[0] && x[1]; });
      if (steps.length < 2) { toast('Add at least two steps'); return; }
      S.funnels[sid] = steps; delete EXT.aud[sid]; save(); render(); loadAud(sid).then(function () { render(); });
    });
  };
  ACT['test-channels'] = function () { sendChannels('✅ Test message from the Analysis workspace'); toast('Test sent'); };
  ACT['wbr-pdf'] = function () {
    var w = window.open('', '_blank'); if (!w) { toast('Allow pop-ups to print'); return; }
    w.document.write('<!doctype html><meta charset="utf-8"><title>Weekly business review</title><style>body{font:14px/1.6 system-ui,sans-serif;max-width:720px;margin:2rem auto;padding:0 1rem;color:#111}h1{font-size:1.6rem}h2{font-size:1.05rem;margin-top:1.4rem;border-bottom:1px solid #ddd;padding-bottom:.2rem}ul{padding-left:1.2rem}li{margin:.15rem 0}@media print{body{margin:0}}</style>' + mdToHtml(wbr()));
    w.document.close(); setTimeout(function () { w.focus(); w.print(); }, 300);
  };
  ACT['wbr-mail'] = function () { location.href = 'mailto:?subject=' + encodeURIComponent('Weekly business review ' + isoDay(Date.now())) + '&body=' + encodeURIComponent(wbr().slice(0, 1800)); };
  ACT['add-release'] = function () {
    modal('New release note', [[{ name: 'version', label: 'Version', value: '2.2.0' }, { name: 'date', label: 'Date', type: 'date', value: isoDay(Date.now()) }], { name: 'type', label: 'Type', type: 'select', options: ['feature', 'improvement', 'fix', 'breaking'] }, { name: 'title', label: 'Title', required: true }, { name: 'notes', label: 'Notes', type: 'textarea' }], function (v) {
      S.releases.push({ version: v.version, date: v.date, type: v.type, title: v.title, notes: v.notes }); logAct('Added release note “' + v.title + '”', 'decision'); save(); render();
    });
  };
  ACT['dl-changelog'] = function () { download('changelog.json', JSON.stringify(S.releases.slice().sort(function (a, b) { return b.date.localeCompare(a.date); }), null, 2), 'application/json'); toast('Replace changelog.json in your site with this file'); };
  ACT['copy-snippet'] = function () { copy(integrationSnippet(), 'Snippet copied'); };
  ACT['tab-scroll'] = function () { var e = $('integ'); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  ACT['load-sb'] = function () {
    var sb = S.supabase; if (!sb.url || !sb.key) { toast('Add the project URL and anon key'); return; }
    fetch(sb.url.replace(/\/$/, '') + '/rest/v1/rpc/analytics_summary', { method: 'POST', headers: { apikey: sb.key, Authorization: 'Bearer ' + sb.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_site: CFG.chat.siteId, p_days: 14 }) })
      .then(function (r) { return r.ok ? r.json() : r.text().then(function (t) { throw new Error('Supabase said: ' + t.slice(0, 120)); }); })
      .then(function (d) { EXT.sb = { data: d }; render(); }).catch(function (e) { EXT.sb = { error: e.message || 'Could not reach Supabase' }; render(); });
  };
  function itemModal(i) {
    var it = i === null ? { title: '', product: 'nexora', lane: 'next', reach: 300, impact: 1, confidence: 80, effort: 2 } : S.roadmap[i];
    modal(i === null ? 'New initiative' : 'Edit initiative', [{ name: 'title', label: 'Initiative', value: it.title, required: true },
      [{ name: 'product', label: 'Product', type: 'select', options: PRODUCTS, value: it.product }, { name: 'lane', label: 'Lane', type: 'select', options: [['now', 'Now'], ['next', 'Next'], ['later', 'Later'], ['done', 'Done']], value: it.lane }],
      [{ name: 'reach', label: 'Reach (people / quarter)', type: 'number', value: it.reach, min: 0 }, { name: 'impact', label: 'Impact', type: 'select', options: [['3', '3 · Massive'], ['2', '2 · High'], ['1', '1 · Medium'], ['0.5', '0.5 · Low'], ['0.25', '0.25 · Minimal']], value: String(it.impact) }],
      [{ name: 'confidence', label: 'Confidence', type: 'select', options: [['100', '100% · High'], ['80', '80% · Medium'], ['50', '50% · Low']], value: String(it.confidence) }, { name: 'effort', label: 'Effort (person-weeks)', type: 'number', value: it.effort, min: 0.5, step: '0.5' }]],
      function (v) {
        var n = { id: it.id || uid(), title: v.title, product: v.product, lane: v.lane, reach: v.reach, impact: Number(v.impact), confidence: Number(v.confidence), effort: Math.max(.5, v.effort) };
        if (i === null) S.roadmap.push(n); else S.roadmap[i] = n; logAct((i === null ? 'Added' : 'Updated') + ' initiative “' + n.title + '”', 'roadmap'); save(); render();
      });
  }
  function copy(text, msg) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast(msg); }, function () { toast('Copy failed'); }); }
  function download(name, text, type) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name; a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000); }

  /* ================= events ================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act]'); if (!el || !ACT[el.dataset.act]) return;
    ACT[el.dataset.act](el);
  });
  function castVal(el) { if (el.type === 'checkbox') return el.checked; if (el.type === 'number' || el.type === 'range') return el.value === '' && el.hasAttribute('data-null') ? null : Number(el.value); return el.value; }
  document.addEventListener('input', function (e) {
    var el = e.target; if (!el.getAttribute || el.type !== 'range' || !el.hasAttribute('data-set')) return;
    var path = el.getAttribute('data-set'), v = Number(el.value); setPath(path, v); save(); el.style.setProperty('--v', (path.slice(-4) === 'conf' ? v * 10 : v) + '%');
    var out = document.querySelector('[data-out="' + path + '"]'); if (out) out.textContent = path.slice(-4) === 'conf' ? v + '/10' : v + '%';
  });
  document.addEventListener('change', function (e) {
    var el = e.target; if (!el.getAttribute || !el.hasAttribute('data-set')) return;
    var pth = el.getAttribute('data-set'), fm = pth.match(/^flags\.(\d+)\.(on|rollout)$/);
    setPath(pth, castVal(el));
    if (fm) { var fl = S.flags[fm[1]]; logAct(fm[2] === 'on' ? (fl.on ? 'Turned ON flag ' : 'Turned OFF flag ') + fl.key : 'Set ' + fl.key + ' rollout to ' + fl.rollout + '%', 'flag'); }
    save(); render();
  });
  $('importFile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return; var rd = new FileReader();
    rd.onload = function () { try { var d = JSON.parse(rd.result); if (d.v !== 1) throw 0; S = norm(d); logAct('Imported a backup', 'info'); save(); render(); toast('Backup imported'); } catch (er) { toast('Not a valid backup file'); } e.target.value = ''; };
    rd.readAsText(f);
  });
  var view = $('view');
  view.addEventListener('dragstart', function (e) { var it = e.target.closest && e.target.closest('.item[data-i]'); if (!it) return; e.dataTransfer.setData('text/plain', it.dataset.i); e.dataTransfer.effectAllowed = 'move'; it.classList.add('drag'); });
  view.addEventListener('dragend', function (e) { var it = e.target.closest && e.target.closest('.item'); if (it) it.classList.remove('drag'); });
  view.addEventListener('dragover', function (e) { var l = e.target.closest && e.target.closest('.lane'); if (l) { e.preventDefault(); l.classList.add('over'); } });
  view.addEventListener('dragleave', function (e) { var l = e.target.closest && e.target.closest('.lane'); if (l && !l.contains(e.relatedTarget)) l.classList.remove('over'); });
  view.addEventListener('drop', function (e) {
    var l = e.target.closest && e.target.closest('.lane'); if (!l) return; e.preventDefault();
    var i = Number(e.dataTransfer.getData('text/plain')); if (S.roadmap[i]) { S.roadmap[i].lane = l.dataset.lane; save(); render(); toast('Moved to ' + l.dataset.lane); }
  });

  /* ---------- command palette ---------- */
  var CMDS = TABS.map(function (t) { return { l: 'Go to ' + t[1], k: 'Navigate', f: function () { go(t[0]); } }; }).concat([
    { l: 'Refresh live data', k: 'Action', f: function () { loadData(); toast('Refreshing…'); } }, { l: 'Probe sites now', k: 'Action', f: function () { runProbes(true); } },
    { l: 'Add objective', k: 'Create', f: function () { go('okrs'); ACT['add-okr'](); } }, { l: 'Add roadmap initiative', k: 'Create', f: function () { go('roadmap'); ACT['add-item'](); } },
    { l: 'Add feature flag', k: 'Create', f: function () { go('flags'); ACT['add-flag'](); } }, { l: 'Generate weekly report', k: 'Action', f: function () { go('overview'); setTimeout(ACT.wbr, 30); } },
    { l: 'Export backup', k: 'Action', f: ACT['export-all'] }, { l: 'Toggle light / dark theme', k: 'Action', f: function () { $('themeBtn').click(); } }, { l: 'Open ranking page', k: 'Navigate', f: function () { location.href = './analysis.html'; } },
    { l: 'Toggle demo data', k: 'Action', f: function () { ACT['toggle-demo'](); } }, { l: 'Open status page', k: 'Navigate', f: function () { location.href = './analysis-status.html'; } }, { l: 'Open changelog', k: 'Navigate', f: function () { location.href = './changelog.html'; } }]);
  var palSel = 0, palList = [];
  function palRender() {
    var q = $('palIn').value.toLowerCase().trim(); palList = CMDS.filter(function (c) { return !q || c.l.toLowerCase().indexOf(q) > -1; }); palSel = clamp(palSel, 0, Math.max(0, palList.length - 1));
    $('palList').innerHTML = palList.map(function (c, i) { return '<li class="' + (i === palSel ? 'on' : '') + '" data-i="' + i + '"><span>' + esc(c.l) + '</span><span class="muted">' + c.k + '</span></li>'; }).join('') || '<li class="muted">No matches</li>';
  }
  function palOpen() { $('palIn').value = ''; palSel = 0; palRender(); $('pal').showModal(); $('palIn').focus(); }
  function palRun(i) { var c = palList[i]; if (!c) return; $('pal').close(); c.f(); }
  $('palBtn').onclick = palOpen;
  $('palIn').addEventListener('input', function () { palSel = 0; palRender(); });
  $('palIn').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { palSel = Math.min(palList.length - 1, palSel + 1); palRender(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); palRender(); e.preventDefault(); }
    else if (e.key === 'Enter') { palRun(palSel); e.preventDefault(); }
  });
  $('palList').addEventListener('click', function (e) { var li = e.target.closest('li[data-i]'); if (li) palRun(Number(li.dataset.i)); });
  document.addEventListener('keydown', function (e) { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); palOpen(); } });

  /* ---------- theme + boot ---------- */
  (function () {
    var t; try { t = localStorage.getItem(TKEY); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    $('themeBtn').onclick = function () { var n = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem(TKEY, n); } catch (e) {} };
  })();
  window.addEventListener('hashchange', function () { var id = location.hash.slice(1); if (V[id] && id !== cur) { cur = id; render(); ensure(id); } });
  cur = V[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
  (function () { var sel = $('langSel'); sel.value = LANG; document.documentElement.lang = LANG; sel.onchange = function () { LANG = sel.value; try { localStorage.setItem('nexora_lang', LANG); } catch (e) {} document.documentElement.lang = LANG; render(); }; })();
  render(); loadData(); runProbes(false); ensure(cur);
  setInterval(loadData, CFG.refreshMs); setInterval(function () { runProbes(false); }, 60000);
})();
</script>
</body>
